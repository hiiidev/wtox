# Development self-hosting: API scaffold only, NOT a functioning chat server.
# Put HTTPS/WSS behind a correctly configured Caddy/Nginx proxy before exposure.
services:
  wtox-v1-api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    volumes:
      - wtox_v1_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  wtox_v1_data:
