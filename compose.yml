# wtox backend only. HTTPS termination is handled by your existing VPS reverse proxy.
# Binds the API to loopback to avoid exposing session cookies or keys over plain HTTP.
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8000:8000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
