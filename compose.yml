# Production: Caddy provides HTTPS/WSS; API is internal-only.
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      WTOX_INSECURE_HTTP: "0"
    volumes:
      - wtox_data:/data
    expose:
      - "6066"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6066/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
volumes:
  wtox_data:
  caddy_data:
  caddy_config:
