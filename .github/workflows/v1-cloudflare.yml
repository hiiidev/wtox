name: v1-cloudflare-checks
on:
  push:
    branches: [v1]
    paths:
      - "cloudflare/**"
      - "apps/server/**"
      - "wasm/browser/tcp-tunnel.mjs"
      - "packages/protocol/**"
      - "deploy/compose.v1.yml"
      - ".github/workflows/v1-cloudflare.yml"
  workflow_dispatch:
jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Cloudflare backend dependencies
        working-directory: cloudflare
        run: npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: cloudflare
        run: npm run typecheck
      - name: Run Node tests
        working-directory: cloudflare
        run: npm test
      - name: Validate Cloudflare staging deployment package (no credentials)
        working-directory: cloudflare
        run: npm run deploy:staging:dry-run

  selfhost:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Node.js adapter build tools
        working-directory: apps/server
        run: npm install --no-audit --no-fund
      - name: Typecheck Node.js adapter
        working-directory: apps/server
        run: npm run typecheck
      - name: Test SQLite, TTL, isolation, quota and API parity
        working-directory: apps/server
        run: npm test
