name: v1-wasm-experiment
on:
  push:
    branches: [v1]
    paths:
      - "wasm/**"
      - ".github/workflows/v1-wasm.yml"
  workflow_dispatch:
jobs:
  browser-tox-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake make autoconf automake libtool pkg-config
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: "5.0.1"
      - name: Verify Emscripten compiler
        run: emcc -v
      - name: Install browser test harness
        working-directory: wasm
        run: npm install --no-audit --no-fund
      - name: JS WASM-boundary unit tests
        working-directory: wasm
        run: npm run test:unit
      - name: Compile pinned c-toxcore and libsodium to WASM
        working-directory: wasm
        run: npm run build
      - name: Test genuine WASM Tox ID and encrypted backup roundtrip
        working-directory: wasm
        run: npm run test:wasm
      - name: Test genuine browser Dedicated Worker identity roundtrip
        working-directory: wasm
        run: npm run test:browser
      - name: Upload research artifact (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: wtox-v1-tox-identity-research
          path: |
            wasm/dist/tox_identity.mjs
            wasm/dist/tox_identity.wasm
          retention-days: 3
