name: python-checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt httpx==0.28.1
      - run: python -m compileall -q backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node tests/check_static_assets.mjs
      - run: node tests/react_structure.mjs
      - run: node tests/history_io.mjs
      - run: python -m unittest discover -s tests -v
      - run: cp .env.example .env && docker compose config -q
  native-smoke:
    # Deliberately opt-in until Dockerfile build has been checked on a clean runner.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wtox-native-smoke .

