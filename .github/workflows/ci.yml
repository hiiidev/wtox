name: python-checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt httpx==0.28.1
      - name: Check Python source syntax
        run: python -m compileall -q backend tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Ant Design peer versions before install
        run: node tests/check_npm_peers.mjs
      - name: Install exact frontend dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend
      - name: Archive npm lockfile for reproducible builds
        uses: actions/upload-artifact@v4
        with:
          name: frontend-lockfile
          path: frontend/package-lock.json
          if-no-files-found: error
      - name: Verify npm dependency tree
        run: npm ls antd @ant-design/x @ant-design/icons --depth=0
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node tests/check_static_assets.mjs
      - run: node tests/pwa_notifications.mjs
      - run: node tests/pwa_experience.mjs
      - run: node tests/pwa_startup.mjs
      - run: node tests/ios_splash.mjs
      - run: node tests/react_structure.mjs
      - run: node tests/chat_ui.mjs
      - run: node tests/chat_time.mjs
      - run: node tests/identity_cleanup.mjs
      - run: node tests/tox_download.mjs
      - run: node tests/chat_refinement.mjs
      - run: node tests/chat_translation.mjs
      - run: node tests/site_access.mjs
      - run: node tests/pwa_mobile_message_ux.mjs
      - run: node tests/mobile_friend_qr.mjs
      - run: node tests/history_io.mjs
      - name: Check default queue and profile API invariants
        run: |
          node tests/check_npm_peers.mjs
          python -m compileall -q backend tests
      - name: Python unittest (isolated modules with hang tracebacks)
        shell: bash
        run: |
          set -euo pipefail
          # Per-module timeouts identify the exact test module that stalls.
          # SIGABRT causes -X faulthandler to print Python thread stacks.
          for file in tests/test_*.py; do
            echo "::group::$(basename "$file")"
            timeout -v --signal=SIGABRT --kill-after=10s 90s \
              python -u -X faulthandler -m unittest discover \
                -s tests -p "$(basename "$file")" -v
            echo "::endgroup::"
          done
      - run: cp .env.example .env && docker compose config -q
  native-smoke:
    # Mandatory on PRs to verify native Toxcore and encrypted savedata.
    timeout-minutes: 35
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[native-check]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wtox-native-smoke .

  caddy-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Caddy body cap and browser protection headers
        run: |
          docker run --rm -e SITE_DOMAIN=chat.example.test \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
  lockfile-bootstrap:
    # One-time bootstrapping from this repository's own security PR only.
    # Generates and commits a registry-resolved, integrity-hashed lockfile.
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 17 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/harden-uploads-auth-20261013'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve registry dependency integrity and commit lock
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cd ..
          git add frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'build: commit resolved npm integrity lockfile'
            git push origin "HEAD:refs/heads/${{ github.head_ref }}"
          fi
