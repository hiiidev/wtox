name: wtox-v1-staging-one-shot
# Temporary, explicitly requested single-run trigger because the GitHub
# connector cannot call workflow_dispatch. Remove after completion.
on:
  push:
    branches: [v1]
    paths:
      - "deploy/.wtox-v1-staging-one-shot-trigger"
permissions:
  contents: read
jobs:
  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/v1' && contains(github.event.head_commit.message, '[run-wtox-staging-once]') }}
    name: One-time authorized Cloudflare staging deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: wtox-v1-cloudflare-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify repository secrets are set
        env:
          CF_TOKEN_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_PRESENT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CF_TOKEN_PRESENT" || -z "$CF_ACCOUNT_PRESENT" ]]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID in Repository secrets."
            exit 1
          fi
      - name: Install Cloudflare tools
        working-directory: cloudflare
        run: npm install --no-audit --no-fund
      - name: Verify Workers backend
        working-directory: cloudflare
        run: |
          npm run typecheck
          npm test
      - name: Wrangler build validation without deployment
        working-directory: cloudflare
        run: npm run deploy:staging:dry-run
      - name: Deploy only wtox-v1-staging to Cloudflare Workers.dev
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:staging
      - name: Record staging scope
        run: |
          {
            echo "### Isolated Cloudflare staging only"
            echo "- Worker name: wtox-v1-staging"
            echo "- Custom domain: none"
            echo "- Enabled public APIs: GET /api/v1/health, GET /api/v1/capabilities"
            echo "- Mailbox, identity, relay and push endpoints remain disabled"
            echo "- This run makes no changes to main or the existing VPS"
          } >> "$GITHUB_STEP_SUMMARY"
