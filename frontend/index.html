<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>wtox</title><style>
:root{color-scheme:dark}body{font:15px system-ui;background:#0e1726;color:#eaf0fc;margin:0;min-height:100dvh;display:grid;place-items:center}
main{width:min(90vw,620px);background:#19263a;border:1px solid #354459;padding:28px;border-radius:18px;box-sizing:border-box}
h1{letter-spacing:.5px}input,button{box-sizing:border-box;display:block;width:100%;margin:11px 0;padding:12px;border-radius:8px;font:inherit}
input{background:#0d1523;color:white;border:1px solid #65748c}input[type=file]{padding:8px}
button{cursor:pointer;background:#4077e5;border:0;color:white}button.secondary{background:#374962}
small,.muted{color:#afbdd1}.toxid{font-family:ui-monospace,monospace;overflow-wrap:anywhere;line-height:1.65;padding:12px;background:#0d1523;border-radius:8px}
#error{color:#ff9e9e;min-height:1.2em}section{margin-top:18px}
</style></head>
<body><main><h1>wtox</h1><p class="muted">原版 Tox · 私有 VPS 客户端</p>
<section id="login"><h2>登录 / 创建账号</h2><small>网站访问密码之外，每位使用者有独立账号和 Tox 身份。</small>
<input id="username" autocomplete="username" placeholder="账号名（英文/数字）">
<input id="password" type="password" autocomplete="current-password" placeholder="账号密码（至少12位）">
<button id="signin">登录</button><button id="signup" class="secondary">创建账号</button></section>
<section id="account" hidden><p id="welcome"></p>
<div id="setup" hidden><h2>设置 Tox 身份</h2>
<button id="create">创建新的 Tox ID</button>
<label for="profileFile">或者导入 aTox / qTox 导出的原始 .tox 配置</label>
<input type="file" id="profileFile" accept=".tox,application/octet-stream">
<button id="import" class="secondary">导入 .tox 文件</button>
<small>仅支持原始 Tox Savedata。导入不会恢复聊天历史；请先关闭其他使用同一 Tox 身份的客户端。</small>
</div>
<div id="ready" hidden><h2>你的 Tox ID</h2><p id="toxid" class="toxid"></p>
<button id="export">下载身份备份 (.tox)</button>
<small>备份含私钥，请加密保存、不要发给其他人。原生网络连接、好友及聊天功能仍在开发中。</small>
</div>
<button id="logout" class="secondary">退出个人账号</button>
</section><p id="error" role="alert"></p></main>
<script>
const $=s=>document.querySelector(s);
function error(msg){$('#error').textContent=msg||''}
async function api(url,opts={}){
 const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});
 if(!r.ok){let message='请求失败 ('+r.status+')';try{const data=await r.json();message=data.detail||message}catch{}
 throw new Error(message)}
 return r
}
async function json(url,opts={}){return(await api(url,opts)).json()}
async function status(){
 const s=await json('/api/profile/status');
 $('#setup').hidden=s.has_profile;$('#ready').hidden=!s.has_profile;
 $('#toxid').textContent=s.tox_id||'尚未获取 ID';
}
async function state(){
 try{const me=await json('/api/me');$('#login').hidden=true;$('#account').hidden=false;
 $('#welcome').textContent='已登录：'+me.username;await status()}
 catch(e){$('#login').hidden=false;$('#account').hidden=true}
}
async function auth(url){
 error('');
 try{await json(url,{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value})});await state()}
 catch(e){error(e.message)}
}
$('#signin').onclick=()=>auth('/api/login');$('#signup').onclick=()=>auth('/api/register');
$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});error('');await state()};
$('#create').onclick=async()=>{
 if(!confirm('创建新的 Tox 身份？每个账号首次只能创建或导入一次。'))return;
 error('');try{await json('/api/profile/create',{method:'POST'});await status()}
 catch(e){error(e.message)}
};
$('#import').onclick=async()=>{
 const file=$('#profileFile').files[0];if(!file){error('请先选择 .tox 文件');return}
 if(file.size>8*1024*1024){error('配置文件不能超过 8 MiB');return}
 if(!confirm('确定导入此文件作为这个账号的 Tox 身份？不能覆盖已有身份。'))return;
 error('');try{await json('/api/profile/import',{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:file});await status()}
 catch(e){error(e.message)}
};
$('#export').onclick=async()=>{
 error('');try{
 const r=await api('/api/profile/export');const blob=await r.blob();const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download='wtox-profile.tox';a.click();URL.revokeObjectURL(url)
 }catch(e){error(e.message)}
};
state();
</script></body></html>
